<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vector-search</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .container { width: 100%; max-width: 640px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  form { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1rem;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); }
  button {
    padding: 12px 20px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { color: var(--muted); font-size: 0.85rem; margin: 16px 0 8px; min-height: 1.2em; }
  #results { list-style: none; margin: 0; padding: 0; }
  #results li {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .title { font-weight: 600; margin-bottom: 6px; }
  .summary { color: var(--muted); font-size: 0.88rem; line-height: 1.4; margin-bottom: 6px; }
  .distance { color: var(--accent); font-size: 0.78rem; font-family: monospace; }
</style>
</head>
<body>
<div class="container">
  <h1>Semantic paper search</h1>
  <p class="subtitle">HNSW index built from scratch in C, searching 38,985 arXiv abstracts.</p>

  <form id="search-form">
    <input type="text" id="query" placeholder="e.g. reinforcement learning for robotics" autocomplete="off" required>
    <button type="submit" id="search-btn">Search</button>
  </form>

  <div id="status"></div>
  <ul id="results"></ul>
</div>

<script>
  // Public demo key — deliberately not the same key used for private/programmatic
  // access. Anyone can read this out of the page source; that's expected, not a
  // leak. It's rate-limited server-side specifically so that being public is safe.
  const API_URL = "http://18.119.185.198:8000/search";
  const API_KEY = "roGyQt07qVXg7iPKrDAN5u5TPuE8iM12gNVsnz32iRo";

  const form = document.getElementById("search-form");
  const input = document.getElementById("query");
  const button = document.getElementById("search-btn");
  const status = document.getElementById("status");
  const results = document.getElementById("results");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const query = input.value.trim();
    if (!query) return;

    button.disabled = true;
    status.textContent = "Searching...";
    results.innerHTML = "";

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-API-Key": API_KEY,
        },
        body: JSON.stringify({ query, k: 5 }),
      });

      if (response.status === 429) {
        status.textContent = "Too many searches right now — wait a few seconds and try again.";
        return;
      }
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        status.textContent = `Error: ${body.detail || response.statusText}`;
        return;
      }

      const data = await response.json();
      status.textContent = `${data.results.length} results for "${data.query}"`;

      for (const r of data.results) {
        const item = document.createElement("li");
        item.innerHTML = `
          <div class="title">${escapeHtml(r.title)}</div>
          <div class="summary">${escapeHtml(r.summary)}</div>
          <div class="distance">distance: ${r.distance.toFixed(3)}</div>
        `;
        results.appendChild(item);
      }
    } catch (err) {
      status.textContent = "Couldn't reach the search service — it may be offline right now.";
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
